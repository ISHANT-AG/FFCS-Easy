<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E3A8A" />
    <title>FFCS Easy · Plan your semester</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=20261030-v2" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon.png?v=20261030-v2" />
    <link rel="apple-touch-icon" href="assets/favicon.png?v=20261030-v2" />
    <link rel="shortcut icon" href="favicon.ico?v=20261030-v2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=20261030-demo-orbit" />
  </head>
  <body>
    <!-- Introduction Splash Animation -->
    <div id="intro-splash" class="intro-splash" aria-label="FFCS Easy Introduction">
      <div class="intro-backdrop"></div>
      <div class="intro-content">
        <div class="intro-logo-box">
          <img src="assets/logo-icon.png" alt="FFCS Easy Logo" class="intro-logo-icon" />
        </div>
        <div class="intro-text-box">
          <h1 class="intro-title">FFCS <span class="intro-title-accent">Easy</span></h1>
          <p class="intro-tagline">Pick <span class="intro-dot">•</span> Plan <span class="intro-dot">•</span> Register</p>
        </div>
        <div class="intro-loader-bar">
          <div class="intro-loader-progress"></div>
        </div>
      </div>
      <button class="intro-skip-btn" id="intro-skip" type="button" aria-label="Skip introduction">Skip ✕</button>
    </div>

    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <!-- Feedback Dialog -->
    <dialog id="feedback-dialog" class="feedback-dialog" aria-labelledby="feedback-heading">
      <div class="feedback-dialog-header">
        <div>
          <h2 id="feedback-heading">Share your feedback</h2>
          <p class="feedback-subtitle">Help us improve FFCS Easy for all students</p>
        </div>
        <button type="button" id="close-feedback" class="dialog-close-btn" aria-label="Close feedback">✕</button>
      </div>

      <form id="feedback-form" class="feedback-form">
        <!-- 5 Star Rating -->
        <div class="feedback-field">
          <label class="feedback-label">How was your experience? <span class="required">*</span></label>
          <div class="star-rating" role="radiogroup" aria-label="Rating out of 5">
            <input type="radio" id="star5" name="rating" value="5" required />
            <label for="star5" title="5 stars - Amazing">★</label>
            <input type="radio" id="star4" name="rating" value="4" />
            <label for="star4" title="4 stars - Good">★</label>
            <input type="radio" id="star3" name="rating" value="3" />
            <label for="star3" title="3 stars - Okay">★</label>
            <input type="radio" id="star2" name="rating" value="2" />
            <label for="star2" title="2 stars - Poor">★</label>
            <input type="radio" id="star1" name="rating" value="1" />
            <label for="star1" title="1 star - Terrible">★</label>
          </div>
        </div>

        <!-- Topic Tags / Category -->
        <div class="feedback-field">
          <label class="feedback-label">What is this regarding?</label>
          <div class="feedback-chips">
            <label class="chip-item">
              <input type="radio" name="category" value="Timetables & Clashes" checked />
              <span>Timetables &amp; Clashes</span>
            </label>
            <label class="chip-item">
              <input type="radio" name="category" value="PDF Upload & Faculty" />
              <span>PDF Upload &amp; Faculty</span>
            </label>
            <label class="chip-item">
              <input type="radio" name="category" value="Courses & Credits" />
              <span>Courses &amp; Credits</span>
            </label>
            <label class="chip-item">
              <input type="radio" name="category" value="Feature Request" />
              <span>Feature Request</span>
            </label>
            <label class="chip-item">
              <input type="radio" name="category" value="Bug Report" />
              <span>Bug Report</span>
            </label>
            <label class="chip-item">
              <input type="radio" name="category" value="General Praise" />
              <span>General</span>
            </label>
          </div>
        </div>

        <!-- Message -->
        <div class="feedback-field">
          <label class="feedback-label" for="feedback-message">Your suggestions or issues <span class="required">*</span></label>
          <textarea id="feedback-message" name="message" rows="3" required placeholder="What worked well? What was confusing or broken? Any features you'd like to see?"></textarea>
        </div>

        <!-- Student Info (Optional) -->
        <div class="feedback-grid-row">
          <div class="feedback-field">
            <label class="feedback-label" for="feedback-name">Your Name (Optional)</label>
            <input type="text" id="feedback-name" name="name" placeholder="e.g. Ishant / Prisha" />
          </div>
          <div class="feedback-field">
            <label class="feedback-label" for="feedback-contact">Contact or Reg No (Optional)</label>
            <input type="text" id="feedback-contact" name="contact" placeholder="Email or Registration No" />
          </div>
        </div>

        <div class="feedback-actions">
          <button type="button" class="secondary-btn" id="cancel-feedback">Cancel</button>
          <button type="submit" class="primary feedback-submit-btn" id="submit-feedback">
            <span>Send Feedback</span>
            <svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
          </button>
        </div>
      </form>

      <!-- Success Screen -->
      <div id="feedback-success" class="feedback-success" style="display: none;">
        <div class="success-icon-wrap">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h3>Thank you for your feedback!</h3>
        <p>Your inputs help us make FFCS Easy better for everyone.</p>
        <button type="button" class="primary" id="success-done-btn">Done</button>
      </div>
    </dialog>

    <dialog id="demo-dialog" class="demo-dialog" aria-labelledby="demo-heading">
      <div class="demo-dialog-header">
        <h2 id="demo-heading">Watch the FFCS easy demo</h2>
        <button type="button" id="close-demo" aria-label="Close demo">✕</button>
      </div>
      <div class="demo-video">
        <iframe
          id="demo-player"
          title="FFCS easy walkthrough"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
      <p class="demo-link">
        Video not loading?
        <a
          href="https://www.youtube.com/watch?v=MFKUypP14OA"
          target="_blank"
          rel="noopener noreferrer"
          >Watch on YouTube ↗</a
        >
      </p>
    </dialog>

    <script>
      (function() {
        const splash = document.getElementById('intro-splash');
        if (!splash) return;
        let dismissed = false;

        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          splash.classList.add('is-hidden');
          setTimeout(() => {
            splash.classList.add('is-removed');
            splash.remove();
          }, 480);
        }

        // Auto-dismiss smoothly after intro finishes playing (~1.85s)
        const timer = setTimeout(dismiss, 1850);

        // Skip button or clicking outside dismisses immediately
        splash.addEventListener('click', (e) => {
          clearTimeout(timer);
          dismiss();
        });

        // Keyboard Esc or Space skip
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' || e.key === ' ') {
            clearTimeout(timer);
            dismiss();
          }
        });
      })();
    </script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
